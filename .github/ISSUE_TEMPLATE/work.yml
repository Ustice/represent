name: Work item
description: A problem, proposal, or bounded piece of work.
body:
  - type: textarea
    id: outcome
    attributes:
      label: What needs to change?
      description:
        Describe the problem or intended outcome. Add an example if useful.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and evidence
      description:
        Relevant links, constraints, reproduction steps, or ways to verify the
        result. Omit what does not apply.
